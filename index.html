<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Kost Kosi Modern</title>
    <!-- Tailwind CSS untuk Styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Poppins -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Poppins', 'sans-serif'] },
                    colors: {
                        primary: '#4f46e5',
                        primary_hover: '#4338ca',
                        secondary: '#10b981',
                        dark: '#0f172a',
                        darker: '#020617',
                        surface: '#1e293b'
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Poppins', sans-serif; transition: background-color 0.3s ease, color 0.3s ease; }
        
        .fade-in { animation: fadeIn 0.4s cubic-bezier(0.4, 0, 0.2, 1) forwards; }
        .modal-fade-in { animation: modalFadeIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        
        .delay-100 { animation-delay: 100ms; }
        .delay-200 { animation-delay: 200ms; }
        .delay-300 { animation-delay: 300ms; }
        
        .btn-animate { transition: all 0.25s cubic-bezier(0.25, 0.8, 0.25, 1); }
        .btn-animate:hover { transform: translateY(-3px); box-shadow: 0 10px 25px -5px rgba(79, 70, 229, 0.3); }
        .btn-animate:active { transform: translateY(1px); }

        .card-hover { transition: all 0.3s ease; }
        .card-hover:hover { transform: translateY(-5px); box-shadow: 0 15px 30px -5px rgba(0, 0, 0, 0.1); }
        .dark .card-hover:hover { box-shadow: 0 15px 30px -5px rgba(0, 0, 0, 0.3); border-color: rgba(79, 70, 229, 0.5); }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes modalFadeIn { from { opacity: 0; transform: scale(0.95) translateY(10px); } to { opacity: 1; transform: scale(1) translateY(0); } }
        
        /* Toast Notification */
        #toast-container { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 10000; display: flex; flex-direction: column; gap: 12px; width: 90%; max-width: 400px; pointer-events: none;}
        .toast { pointer-events: auto; padding: 14px 20px; border-radius: 16px; color: white; font-weight: 600; box-shadow: 0 15px 30px -5px rgba(0, 0, 0, 0.3); opacity: 0; transform: translateY(-100%); animation: toastSlideDown 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards, toastFadeOut 0.4s forwards 3.5s; display: flex; align-items: center; gap: 12px; backdrop-filter: blur(10px); }
        .toast.success { background: linear-gradient(135deg, #10b981, #059669); }
        .toast.error { background: linear-gradient(135deg, #ef4444, #dc2626); }
        .toast.info { background: linear-gradient(135deg, #3b82f6, #2563eb); }
        @keyframes toastSlideDown { to { opacity: 1; transform: translateY(0); } }
        @keyframes toastFadeOut { to { opacity: 0; transform: translateY(-20px); } }

        /* Update Badge Notification (Float at bottom center, above nav bar) */
        #update-badge { position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%) translateY(150%); z-index: 9998; transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); opacity: 0; }
        #update-badge.show { transform: translateX(-50%) translateY(0); opacity: 1; }
        @media (min-width: 768px) { #update-badge { bottom: 30px; } }

        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .dark ::-webkit-scrollbar-thumb { background: #475569; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        .glass { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-bottom: 1px solid rgba(0, 0, 0, 0.05); }
        .dark .glass { background: rgba(15, 23, 42, 0.85); border-bottom: 1px solid rgba(255, 255, 255, 0.05); }

        /* Safe area padding for mobile notches */
        @supports (padding-bottom: env(safe-area-inset-bottom)) {
            .pb-safe { padding-bottom: env(safe-area-inset-bottom); }
        }

        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #4f46e5; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 20px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 dark:bg-darker dark:text-slate-100 h-[100dvh] w-screen antialiased selection:bg-primary selection:text-white overflow-hidden">

    <!-- Toast Container -->
    <div id="toast-container"></div>
    
    <!-- Update Badge Notification -->
    <button id="update-badge" onclick="triggerManualRender()" class="px-5 py-2.5 bg-blue-600 hover:bg-blue-700 text-white text-sm font-bold rounded-full shadow-2xl border-2 border-white/20 flex items-center gap-2">
        <i class="ph-bold ph-arrows-clockwise animate-spin-slow text-lg"></i> Data Baru. Refresh
    </button>

    <!-- App Container -->
    <div id="app" class="w-full h-full overflow-hidden flex relative">
        <div class="w-full h-full flex items-center justify-center">
            <div class="loader"></div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, doc, setDoc, getDoc, getDocs, onSnapshot, deleteDoc, updateDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // ==========================================
        // 1. FIREBASE CONFIGURATION
        // ==========================================
        let firebaseConfig = null;
        if (typeof __firebase_config !== 'undefined' && __firebase_config) {
            try { firebaseConfig = JSON.parse(__firebase_config); } catch(e) { }
        }

        if (!firebaseConfig) {
             firebaseConfig = {
                apiKey: "AIzaSyBM-y6dUxLLgF1z41k-vGKjclJeM7QkO3s",
                authDomain: "webkost-5a25e.firebaseapp.com",
                projectId: "webkost-5a25e",
                storageBucket: "webkost-5a25e.firebasestorage.app",
                messagingSenderId: "316395682089",
                appId: "1:316395682089:web:2286a38e4b2f843a055f38",
                measurementId: "G-4GFHKK1TN5"
            };
        }

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'kost-kosi-app';

        // ==========================================
        // 2. STATE MANAGEMENT 
        // ==========================================
        let state = {
            loggedInUser: null, 
            admin: [], penghuni: [], kamar: [], sewa: [], tagihan: [], komplain: [], pengumuman: [],
            isDataLoaded: false
        };

        let pendingStateUpdates = {}; 
        let hasPendingUpdates = false;
        let isLocalAction = false; 
        let currentTab = 'overview';
        let unsubscribeListeners = [];

        // ==========================================
        // 3. UTILITY FUNCTIONS
        // ==========================================
        window.showToast = (message, type = 'success') => {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            let icon = type === 'success' ? '<i class="ph-fill ph-check-circle text-2xl"></i>' : (type === 'error' ? '<i class="ph-fill ph-warning-octagon text-2xl"></i>' : '<i class="ph-fill ph-info text-2xl"></i>');
            toast.innerHTML = `${icon} <span class="tracking-wide text-sm font-medium leading-snug">${message}</span>`;
            container.appendChild(toast);
            setTimeout(() => { toast.remove(); }, 3500);
        };

        window.initTheme = () => {
            const isDark = localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches);
            if (isDark) document.documentElement.classList.add('dark');
            else document.documentElement.classList.remove('dark');
        };

        window.toggleTheme = () => {
            document.documentElement.classList.toggle('dark');
            localStorage.setItem('theme', document.documentElement.classList.contains('dark') ? 'dark' : 'light');
            render(); 
        };

        window.formatRupiah = (angka) => new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(angka);

        window.getAssignedRoom = (userId) => {
            const sortedSewa = [...state.sewa].sort((a, b) => b.id - a.id);
            const userSewa = sortedSewa.find(s => s.id_penghuni === userId);
            return userSewa ? userSewa.id_kamar : '-';
        };

        const runLocalAction = async (actionFn) => {
            isLocalAction = true;
            try { await actionFn(); } catch (e) { console.error(e); showToast('Terjadi kesalahan sistem', 'error'); }
            setTimeout(() => { isLocalAction = false; }, 1000);
        }

        // ==========================================
        // 4. FIREBASE INITIALIZATION & SMART SYNC
        // ==========================================
        async function initAuth() {
            try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) await signInWithCustomToken(auth, __initial_auth_token);
                else await signInAnonymously(auth);
            } catch (error) { document.getElementById('app').innerHTML = `<div class="p-6 text-center text-red-500">Gagal terhubung ke autentikasi: ${error.message}</div>`; }
        }

        const getColRef = (colName) => collection(db, 'artifacts', appId, 'public', 'data', colName);
        const getDocRef = (colName, docId) => doc(db, 'artifacts', appId, 'public', 'data', colName, String(docId));

        async function seedInitialDataIfNeeded() {
            const adminSnap = await getDocs(getColRef('admin'));
            if (adminSnap.empty) {
                await setDoc(getDocRef('admin', 1), { id: 1, username: 'admin', password: '123', nama: 'Bapak Kost' });
                await setDoc(getDocRef('kamar', 101), { id: 101, fasilitas: 'Kasur, Lemari, AC, Wi-Fi', lantai: 1, ukuran: 4, harga: 800000, status: 'Terisi' });
                await setDoc(getDocRef('kamar', 102), { id: 102, fasilitas: 'Kasur, Lemari, Kipas, Jendela', lantai: 1, ukuran: 3, harga: 550000, status: 'Terisi' });
                await setDoc(getDocRef('kamar', 201), { id: 201, fasilitas: 'Kasur, Meja, AC, KM Dalam', lantai: 2, ukuran: 5, harga: 1200000, status: 'Tersedia' });
                await setDoc(getDocRef('penghuni', 1), { id: 1, username: 'rama', password: '123', no_hp: '08123456789', nama: 'Rama Wijaya', tgl_masuk: '2026-01-10' });
                await setDoc(getDocRef('penghuni', 2), { id: 2, username: 'budi', password: '123', no_hp: '08567890123', nama: 'Budi Santoso', tgl_masuk: '2026-03-15' });
                await setDoc(getDocRef('sewa', 1), { id: 1, id_penghuni: 1, id_kamar: 101 });
                await setDoc(getDocRef('sewa', 2), { id: 2, id_penghuni: 2, id_kamar: 102 });
                await setDoc(getDocRef('tagihan', 1), { id: 1, id_penghuni: 1, id_kamar: 101, nominal: 800000, status_bayar: 'Belum Lunas', metode: null, tanggal: new Date().toISOString().split('T')[0] });
                await setDoc(getDocRef('tagihan', 2), { id: 2, id_penghuni: 2, id_kamar: 102, nominal: 550000, status_bayar: 'Lunas', metode: 'Transfer BCA', tanggal: '2026-04-01' });
                await setDoc(getDocRef('komplain', 1), { id: 1, id_penghuni: 2, isi: 'Air di kamar mandi lantai 1 mampet pak.', status: 'Pending', tanggal: 'Baru saja' });
            }
        }

        function setupListeners() {
            unsubscribeListeners.forEach(unsub => unsub());
            unsubscribeListeners = [];

            const collectionsToSync = ['admin', 'penghuni', 'kamar', 'sewa', 'tagihan', 'komplain', 'pengumuman'];
            let loadedCount = 0;
            
            collectionsToSync.forEach(colName => {
                const unsub = onSnapshot(getColRef(colName), (snapshot) => {
                    const data = [];
                    snapshot.forEach(doc => data.push(doc.data()));
                    
                    if (!state.isDataLoaded) {
                        state[colName] = data;
                        loadedCount++;
                        if (loadedCount === collectionsToSync.length) {
                            state.isDataLoaded = true;
                            render();
                        }
                    } else {
                        if (isLocalAction || !state.loggedInUser) {
                            state[colName] = data;
                            render(); 
                        } else {
                            pendingStateUpdates[colName] = data;
                            hasPendingUpdates = true;
                            document.getElementById('update-badge')?.classList.add('show');
                        }
                    }
                });
                unsubscribeListeners.push(unsub);
            });
        }

        window.triggerManualRender = () => {
            for(let key in pendingStateUpdates) { state[key] = pendingStateUpdates[key]; }
            pendingStateUpdates = {}; hasPendingUpdates = false;
            document.getElementById('update-badge')?.classList.remove('show');
            render(); 
        };

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                if (firebaseConfig.apiKey === "") return;
                await seedInitialDataIfNeeded();
                setupListeners();
            }
        });

        // ==========================================
        // 5. MAIN RENDERER
        // ==========================================
        function render() {
            if (!state.isDataLoaded) return; 

            const app = document.getElementById('app');
            app.innerHTML = ''; 

            if (!state.loggedInUser) {
                app.appendChild(LoginView());
            } else {
                app.appendChild(MainLayout());
            }
        }

        // ==========================================
        // 6. VIEWS (COMPONENTS)
        // ==========================================

        function LoginView() {
            const div = document.createElement('div');
            div.className = 'w-full h-full flex items-center justify-center p-4 md:p-6 fade-in relative overflow-hidden bg-slate-50 dark:bg-darker';
            
            div.innerHTML = `
                <div class="absolute inset-0 z-0">
                    <div class="absolute top-[-20%] left-[-10%] w-[400px] md:w-[600px] h-[400px] md:h-[600px] bg-primary/20 rounded-full blur-[80px] md:blur-[100px] mix-blend-multiply dark:mix-blend-lighten animate-pulse" style="animation-duration: 4s;"></div>
                    <div class="absolute bottom-[-20%] right-[-10%] w-[300px] md:w-[500px] h-[300px] md:h-[500px] bg-secondary/20 rounded-full blur-[80px] md:blur-[100px] mix-blend-multiply dark:mix-blend-lighten animate-pulse" style="animation-duration: 5s;"></div>
                </div>

                <div class="relative z-10 w-full max-w-md glass p-6 md:p-10 rounded-[2rem] md:rounded-[2.5rem] shadow-2xl border border-white/50 dark:border-slate-700/50">
                    <div class="text-center mb-8">
                        <div class="inline-flex p-3.5 md:p-4 bg-gradient-to-tr from-primary to-indigo-400 rounded-2xl mb-4 md:mb-5 shadow-lg shadow-primary/30 transform rotate-3">
                            <i class="ph-fill ph-buildings text-4xl text-white"></i>
                        </div>
                        <h1 class="text-2xl md:text-3xl font-extrabold text-slate-800 dark:text-white tracking-tight mb-1 md:mb-2">Kost Kosi</h1>
                        <p class="text-slate-500 dark:text-slate-400 text-xs md:text-sm font-medium">Sistem Manajemen Kost Cerdas</p>
                    </div>
                    
                    <form id="loginForm" class="space-y-4 md:space-y-5">
                        <div>
                            <label class="block text-xs md:text-sm font-semibold mb-1.5 md:mb-2 text-slate-700 dark:text-slate-300">Username</label>
                            <div class="relative group">
                                <i class="ph ph-user absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 text-lg group-focus-within:text-primary transition-colors"></i>
                                <input type="text" id="username" placeholder="Masukkan username" required class="w-full pl-11 md:pl-12 pr-4 py-3 md:py-3.5 rounded-xl bg-white/60 dark:bg-slate-900/60 border border-slate-200 dark:border-slate-700 focus:ring-2 focus:ring-primary focus:border-primary outline-none transition-all text-slate-800 dark:text-white backdrop-blur-md text-sm md:text-base">
                            </div>
                        </div>
                        <div>
                            <label class="block text-xs md:text-sm font-semibold mb-1.5 md:mb-2 text-slate-700 dark:text-slate-300">Password</label>
                            <div class="relative group">
                                <i class="ph ph-lock-key absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 text-lg group-focus-within:text-primary transition-colors"></i>
                                <input type="password" id="password" placeholder="••••••••" required class="w-full pl-11 md:pl-12 pr-12 py-3 md:py-3.5 rounded-xl bg-white/60 dark:bg-slate-900/60 border border-slate-200 dark:border-slate-700 focus:ring-2 focus:ring-primary focus:border-primary outline-none transition-all text-slate-800 dark:text-white backdrop-blur-md text-sm md:text-base">
                                <button type="button" id="togglePasswordBtn" class="absolute right-2 top-1/2 -translate-y-1/2 text-slate-400 hover:text-primary transition-colors p-2 rounded-lg">
                                    <i id="togglePasswordIcon" class="ph ph-eye-slash text-xl"></i>
                                </button>
                            </div>
                        </div>
                        <div>
                            <label class="block text-xs md:text-sm font-semibold mb-1.5 md:mb-2 text-slate-700 dark:text-slate-300">Akses Masuk</label>
                            <div class="relative group">
                                <i class="ph ph-shield-check absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 text-lg group-focus-within:text-primary transition-colors"></i>
                                <select id="role" class="w-full pl-11 md:pl-12 pr-4 py-3 md:py-3.5 rounded-xl bg-white/60 dark:bg-slate-900/60 border border-slate-200 dark:border-slate-700 focus:ring-2 focus:ring-primary focus:border-primary outline-none transition-all text-slate-800 dark:text-white appearance-none cursor-pointer backdrop-blur-md font-medium text-sm md:text-base">
                                    <option value="Admin">🔑 Admin Kost</option>
                                    <option value="Penghuni">👤 Penghuni Kamar</option>
                                </select>
                                <i class="ph ph-caret-down absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none"></i>
                            </div>
                        </div>
                        <button type="submit" class="btn-animate w-full py-3.5 md:py-4 mt-6 md:mt-8 bg-gradient-to-r from-primary to-indigo-500 text-white font-bold rounded-xl flex justify-center items-center gap-2 shadow-lg shadow-primary/30 text-sm md:text-base">
                            <span class="tracking-wide">MASUK SEKARANG</span> <i class="ph-bold ph-arrow-right"></i>
                        </button>
                    </form>
                </div>
            `;

            const toggleBtn = div.querySelector('#togglePasswordBtn'), passInput = div.querySelector('#password'), toggleIcon = div.querySelector('#togglePasswordIcon');
            toggleBtn.addEventListener('click', () => {
                if (passInput.type === 'password') { passInput.type = 'text'; toggleIcon.className = 'ph-fill ph-eye text-xl text-primary'; } 
                else { passInput.type = 'password'; toggleIcon.className = 'ph ph-eye-slash text-xl text-slate-400'; }
            });

            div.querySelector('#loginForm').addEventListener('submit', (e) => {
                e.preventDefault();
                const u = div.querySelector('#username').value.trim(), p = div.querySelector('#password').value.trim(), r = div.querySelector('#role').value.replace('🔑 ', '').replace('👤 ', '').replace(' Kost', '').replace(' Kamar', '').trim();
                let userFound = r === 'Admin' ? state.admin.find(x => x.username === u && x.password === p) : state.penghuni.find(x => x.username === u && x.password === p);

                if (userFound) {
                    state.loggedInUser = { id: userFound.id, username: userFound.username, role: r, nama: userFound.nama || userFound.username };
                    currentTab = 'overview'; 
                    showToast(`Selamat datang, ${state.loggedInUser.nama}!`, 'success');
                    render();
                } else { showToast('Username atau Password Salah!', 'error'); }
            });

            return div;
        }

        // --- MAIN LAYOUT (MOBILE NAV BAR + DESKTOP SIDEBAR) ---
        function MainLayout() {
            const container = document.createElement('div');
            container.className = 'flex w-full h-full overflow-hidden bg-slate-50 dark:bg-darker relative';

            const isAdmin = state.loggedInUser.role === 'Admin';
            
            // Konfigurasi Menu
            const menus = isAdmin ? [
                { id: 'overview', icon: 'ph-squares-four', label: 'Overview', showOnMobile: true }, 
                { id: 'kamar', icon: 'ph-door', label: 'Kamar', showOnMobile: true },
                { id: 'penghuni', icon: 'ph-users', label: 'Penghuni', showOnMobile: true }, 
                { id: 'tagihan', icon: 'ph-wallet', label: 'Tagihan', showOnMobile: true },
                { id: 'komplain', icon: 'ph-chat-circle-text', label: 'Komplain', showOnMobile: false }, // Di hidden di bottom nav mobile, akses lewat menu "Lainnya"
                { id: 'pengumuman', icon: 'ph-megaphone', label: 'Info', showOnMobile: false },
                { id: 'more', icon: 'ph-dots-three-circle', label: 'Lainnya', showOnMobile: true, isAction: true } // Tombol khusus mobile
            ] : [
                { id: 'overview', icon: 'ph-house', label: 'Beranda', showOnMobile: true }, 
                { id: 'tagihan', icon: 'ph-receipt', label: 'Tagihan', showOnMobile: true },
                { id: 'komplain', icon: 'ph-headset', label: 'Bantuan', showOnMobile: true },
            ];

            // --- 1. SIDEBAR DESKTOP (Hidden on Mobile) ---
            const sidebar = document.createElement('aside');
            sidebar.className = 'w-64 flex-shrink-0 border-r border-slate-200 dark:border-slate-800 bg-white dark:bg-surface hidden md:flex flex-col z-20';
            
            let sidebarMenusHtml = menus.filter(m => !m.isAction).map(m => `
                <button onclick="changeTab('${m.id}')" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl mb-1.5 transition-all ${currentTab === m.id ? 'bg-primary text-white font-semibold shadow-md shadow-primary/20' : 'text-slate-500 hover:bg-slate-100 dark:text-slate-400 dark:hover:bg-slate-800/50 hover:text-slate-800 dark:hover:text-white font-medium'}">
                    <i class="${currentTab === m.id ? 'ph-fill' : 'ph'} ${m.icon} text-xl"></i><span>${m.label === 'Info' ? 'Pengumuman' : m.label}</span>
                </button>
            `).join('');

            sidebar.innerHTML = `
                <div class="h-20 flex items-center px-6 border-b border-slate-100 dark:border-slate-800 shrink-0">
                    <div class="flex items-center gap-3 text-primary"><i class="ph-fill ph-buildings text-3xl"></i><span class="text-xl font-extrabold tracking-tight text-slate-800 dark:text-white">Kost Kosi</span></div>
                </div>
                <div class="flex-1 overflow-y-auto p-4 custom-scrollbar">
                    <p class="text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-4 px-2">Menu Utama</p>${sidebarMenusHtml}
                </div>
                <div class="p-4 border-t border-slate-100 dark:border-slate-800 shrink-0">
                    <div class="flex items-center gap-3 mb-4 px-2">
                        <div class="w-10 h-10 rounded-full bg-gradient-to-tr from-primary to-indigo-400 text-white flex items-center justify-center font-bold shadow-sm shrink-0">${state.loggedInUser.username.charAt(0).toUpperCase()}</div>
                        <div class="overflow-hidden">

            moreMenuOverlay.innerHTML = `
                <div class="bg-white dark:bg-surface w-full rounded-t-3xl p-6 shadow-2xl transform translate-y-full transition-transform duration-300" id="moreMenuContent">

                    <div class="grid grid-cols-3 gap-4 mb-6">
                        <button onclick="changeTab('komplain')" class="flex flex-col items-center gap-2 p-3 rounded-2xl ${currentTab==='komplain' ? 'bg-primary/10 text-primary' : 'bg-slate-50 dark:bg-slate-800 text-slate-600 dark:text-slate-300'}">

                else if(currentTab === 'kamar') contentEl = renderAdminKamar();

        window.toggleMobileMoreMenu = () => {
            const overlay = document.getElementById('mobileMoreMenu');

                if(overlay.classList.contains('hidden')) {
                    overlay.classList.remove('hidden');

                        overlay.classList.remove('opacity-0');
                        content.classList.remove('translate-y-full');

                } else {
                    overlay.classList.add('opacity-0');

            }
        };

        window.changeTab = (tabId) => {

            if(hasPendingUpdates) {
                for(let key in pendingStateUpdates) state[key] = pendingStateUpdates[key];

        // ==========================================

        function renderAdminOverview() {
            const div = document.createElement('div');

            const persentase = totalKamar === 0 ? 0 : Math.round((kamarTerisi / totalKamar) * 100);
            const pendapatan = state.tagihan.filter(t => t.status_bayar === 'Lunas').reduce((sum, t) => sum + t.nominal, 0);
            const komplainPending = state.komplain.filter(k => k.status === 'Pending').length;

            div.innerHTML = `
                <div class="mb-6 md:mb-8 fade-in delay-100">
                    <h3 class="text-xl md:text-2xl font-bold dark:text-white mb-1 md:mb-2">Selamat Datang, ${state.loggedInUser.nama.split(' ')[0]}! 👋</h3>

                        <p class="text-[10px] md:text-xs text-slate-400 mt-2 md:mt-3">${kamarTerisi}/${totalKamar} Terisi</p>
                    </div>
                    <div class="bg-white dark:bg-surface p-4 md:p-6 rounded-[1rem] md:rounded-2xl border border-slate-100 dark:border-slate-800 shadow-sm flex flex-col justify-between">

                            <div><p class="text-slate-500 dark:text-slate-400 text-[10px] md:text-sm font-semibold mb-1">Penghuni</p><h4 class="text-2xl md:text-3xl font-extrabold dark:text-white">${state.penghuni.length}</h4></div>

                    </div>
                    <div class="col-span-2 md:col-span-1 bg-white dark:bg-surface p-4 md:p-6 rounded-[1rem] md:rounded-2xl border border-slate-100 dark:border-slate-800 shadow-sm flex flex-col justify-between">

                    <div class="bg-white dark:bg-surface rounded-2xl border border-slate-200 dark:border-slate-700 p-4 md:p-5 flex flex-col justify-between card-hover fade-in" style="animation-delay: ${(index % 4) * 100}ms;">

                                    <div><h3 class="text-base md:text-xl font-bold dark:text-white leading-tight">Kmr ${k.id}</h3><p class="text-[10px] md:text-xs text-slate-500">Lt ${k.lantai} • ${k.ukuran}m²</p></div>

                                <button onclick="ubahStatusKamar(${k.id})" class="btn-animate p-1.5 md:p-2 bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 text-slate-600 dark:text-slate-300 rounded-lg transition" title="Ubah Status"><i class="ph-bold ph-arrows-left-right"></i></button>

                pengumumanHtml = `
                    <div class="border p-4 md:p-5 rounded-[1.5rem] mb-6 flex gap-3 md:gap-4 items-start shadow-sm ${latest.tipe === 'penting' ? 'bg-red-50 border-red-200 dark:bg-red-900/20 dark:border-red-900/30' : 'bg-blue-50 border-blue-200 dark:bg-blue-900/20 dark:border-blue-900/30'}">
                        <div class="p-2 md:p-3 bg-white dark:bg-slate-800 rounded-full shadow-sm shrink-0"><i class="ph-fill ${latest.tipe === 'penting' ? 'ph-warning-octagon text-red-500' : 'ph-megaphone text-primary'} text-xl md:text-2xl"></i></div>
                        <div class="overflow-hidden"><span class="text-[10px] md:text-xs font-bold uppercase tracking-wider text-slate-500 mb-1 block">Info Admin</span><h4 class="font-extrabold text-sm md:text-lg dark:text-white truncate">${latest.judul}</h4><p class="text-xs md:text-sm mt-1 text-slate-600 dark:text-slate-300 line-clamp-3">${latest.isi}</p></div>
                    </div>
                `;
            }

            div.innerHTML = `
                ${pengumumanHtml}
                <h3 class="text-lg md:text-2xl font-bold dark:text-white mb-4 md:mb-6 fade-in">Ringkasan Kost</h3>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-3 md:gap-6 fade-in delay-100">
                    <div class="bg-white dark:bg-surface rounded-3xl p-5 md:p-6 border border-slate-200 dark:border-slate-700 shadow-sm relative overflow-hidden">
                        <div class="flex items-center gap-2 md:gap-3 mb-3 md:mb-4"><div class="w-8 h-8 md:w-10 md:h-10 bg-primary/10 text-primary rounded-xl flex justify-center items-center"><i class="ph-bold ph-bed text-lg md:text-xl"></i></div><h4 class="font-bold text-slate-500 dark:text-slate-400 text-sm md:text-base">Kamar</h4></div>
                        <h2 class="text-4xl md:text-5xl font-black text-slate-800 dark:text-white mb-1 md:mb-2">${kamarSaya !== '-' ? kamarSaya : '<span class="text-xl">Belum ada</span>'}</h2>
                        <p class="text-xs md:text-sm text-green-500 font-semibold flex items-center gap-1"><i class="ph-fill ph-check-circle"></i> Aktif</p>
                    </div>
                    <div class="bg-white dark:bg-surface rounded-3xl p-5 md:p-6 border border-slate-200 dark:border-slate-700 shadow-sm">
                        <div class="flex items-center gap-2 md:gap-3 mb-3 md:mb-4"><div class="w-8 h-8 md:w-10 md:h-10 bg-red-100 text-red-500 rounded-xl flex justify-center items-center dark:bg-red-500/20"><i class="ph-bold ph-wallet text-lg md:text-xl"></i></div><h4 class="font-bold text-slate-500 dark:text-slate-400 text-sm md:text-base">Tagihan</h4></div>
                        ${tagihanBelumLunas.length > 0 ? `<h2 class="text-2xl md:text-4xl font-black dark:text-white mb-1 md:mb-2">${formatRupiah(tagihanBelumLunas[0].nominal)}</h2><button onclick="changeTab('tagihan')" class="text-xs md:text-sm text-primary font-bold hover:underline">Bayar Sekarang &rarr;</button>` : `<h2 class="text-2xl md:text-4xl font-black dark:text-white mb-1 md:mb-2">Rp 0</h2><p class="text-xs md:text-sm text-green-500 font-semibold flex gap-1"><i class="ph-fill ph-smiley"></i> Lunas.</p>`}
                    </div>
                </div>
                <div class="mt-4 md:mt-6 bg-slate-800 dark:bg-primary text-white rounded-[2rem] p-6 md:p-8 flex flex-col md:flex-row items-center justify-between gap-4 md:gap-5 shadow-xl fade-in delay-200 relative overflow-hidden">
                    <div class="text-center md:text-left z-10"><h3 class="text-lg md:text-2xl font-bold mb-1 md:mb-2">Ada masalah?</h3><p class="text-[10px] md:text-sm text-slate-300">Hubungi Admin sekarang.</p></div>
                    <button onclick="changeTab('komplain')" class="z-10 w-full md:w-auto px-5 py-3 md:py-3.5 bg-white text-slate-800 font-bold rounded-xl shadow-lg flex justify-center gap-2 text-sm md:text-base">Lapor <i class="ph-bold ph-arrow-right"></i></button>
                </div>
            `;
            return div;
        }

        function renderPenghuniTagihan() {
            const div = document.createElement('div');
            const myTagihan = state.tagihan.filter(t => t.id_penghuni === state.loggedInUser.id).sort((a,b) => b.id - a.id);
            let html = '<div class="space-y-3 md:space-y-4 fade-in delay-100">';
            myTagihan.forEach(t => {
                const isLunas = t.status_bayar === 'Lunas', isNunggu = t.status_bayar === 'Menunggu Konfirmasi';
                let bgBorder = isLunas ? 'border-green-200 bg-white dark:bg-surface dark:border-green-900/30' : (isNunggu ? 'border-yellow-200 bg-yellow-50/30 dark:bg-yellow-900/10' : 'border-red-200 bg-red-50/30 shadow-md dark:bg-red-900/10');
                let badge = isLunas ? 'bg-green-100 text-green-600 dark:bg-green-900/30 dark:text-green-400' : (isNunggu ? 'bg-yellow-100 text-yellow-600 dark:bg-yellow-900/30 dark:text-yellow-400' : 'bg-red-100 text-red-600 dark:bg-red-900/30 dark:text-red-400');
                let btn = (!isLunas && !isNunggu) ? `<button onclick="bayarTagihan(${t.id})" class="btn-animate w-full md:w-auto px-6 py-2.5 md:py-3 bg-primary text-white font-bold rounded-xl mt-3 md:mt-0 text-sm md:text-base"><i class="ph-bold ph-wallet"></i> Bayar</button>` : (isNunggu ? `<span class="px-4 py-2.5 md:py-3 bg-slate-100 dark:bg-slate-800 rounded-xl text-[10px] md:text-xs text-slate-500 w-full md:w-auto mt-3 md:mt-0 flex justify-center"><i class="ph-fill ph-hourglass-high"></i> Menunggu Konfirmasi</span>` : '');

                html += `
                    <div class="p-4 md:p-5 rounded-2xl border ${bgBorder} flex flex-col md:flex-row justify-between md:items-center transition-all">
                        <div class="flex gap-3 md:gap-4 items-center">
                            <div class="w-10 h-10 md:w-12 md:h-12 rounded-xl md:rounded-2xl bg-slate-100 dark:bg-slate-800 flex items-center justify-center shrink-0"><i class="ph-fill ph-receipt text-xl md:text-2xl text-slate-400"></i></div>
                            <div class="overflow-hidden">
                                <p class="text-[10px] font-mono text-slate-400 mb-0.5">INV-${String(t.id).substring(0,4)} &bull; ${t.tanggal}</p>
                                <h4 class="text-lg md:text-xl font-extrabold dark:text-white mb-1 truncate">${formatRupiah(t.nominal)}</h4>
                                <span class="px-2 py-0.5 rounded text-[10px] font-bold ${badge} inline-block">${t.status_bayar}</span>
                            </div>
                        </div>
                        <div class="w-full md:w-auto border-t border-slate-100 dark:border-slate-800 md:border-none pt-2 md:pt-0 mt-3 md:mt-0 shrink-0">${btn}</div>
                    </div>
                `;
            });
            div.innerHTML = `<div class="mb-4 md:mb-6 fade-in"><h3 class="text-lg md:text-2xl font-bold dark:text-white">Tagihan Kost</h3></div>${html || '<div class="text-center py-20 text-slate-400 text-sm">Belum ada tagihan.</div></div>'}`;
            return div;
        }

        window.bayarTagihan = (id) => {
            const m = prompt('Ketik angka:\n1 - Transfer BCA\n2 - Uang Tunai (Cash)');
            if(m === '1' || m === '2') runLocalAction(async () => {
                await updateDoc(getDocRef('tagihan', id), { status_bayar: 'Menunggu Konfirmasi', metode: m === '1' ? 'Transfer BCA' : 'Cash' });
                if(m==='1') alert('TRANSFER ke BCA: 988657896 A.N Kost Kosi'); else alert('Notifikasi dikirim ke Admin.');
                showToast('Pembayaran diproses!');
            });
        };

        function renderPenghuniKomplain() {
            const div = document.createElement('div');
            let kompHtml = '';
            [...state.komplain].filter(k => k.id_penghuni === state.loggedInUser.id).sort((a,b) => b.id - a.id).forEach(k => {
                const isP = k.status === 'Pending';
                kompHtml += `
                    <div class="p-3 md:p-4 rounded-xl border border-slate-100 dark:border-slate-800 bg-white dark:bg-surface mb-3 flex flex-col sm:flex-row gap-2 sm:gap-3 items-start shadow-sm">
                        <div class="flex-1 w-full min-w-0">
                            <div class="flex items-center gap-1.5 mb-1.5 md:mb-2"><i class="ph-fill ${isP ? 'ph-clock text-yellow-500' : 'ph-check-circle text-green-500'} text-sm md:text-base"></i><span class="text-[10px] md:text-xs font-medium text-slate-400">${k.status}</span></div>
                            <p class="text-xs md:text-sm dark:text-slate-200 break-words">"${k.isi}"</p>
                        </div>
                        ${isP ? `<button onclick="batalKomplain(${k.id})" class="text-[10px] md:text-xs font-bold text-red-500 bg-red-50 dark:bg-red-900/20 px-2 md:px-3 py-1.5 md:py-2 rounded-lg w-full sm:w-auto mt-1 sm:mt-0">Batal</button>` : ''}
                    </div>
                `;
            });

            div.innerHTML = `
                <div class="grid grid-cols-1 lg:grid-cols-2 gap-5 md:gap-6 fade-in">
                    <div class="order-1">
                        <div class="mb-3 md:mb-5"><h3 class="text-lg md:text-xl font-bold dark:text-white">Lapor Masalah</h3></div>
                        <form id="formKirimKomplain" class="bg-white dark:bg-surface p-4 md:p-5 rounded-3xl shadow-sm border border-slate-200 dark:border-slate-700">
                            <textarea id="isiKomplain" required placeholder="Tulis masalah di sini..." class="w-full p-3 md:p-4 rounded-xl border border-slate-200 bg-slate-50 outline-none dark:bg-slate-900 dark:border-slate-700 dark:text-white h-28 md:h-32 mb-3 md:mb-4 text-sm"></textarea>
                            <button type="submit" class="w-full bg-primary text-white py-3 rounded-xl font-bold text-sm md:text-base">Kirim</button>
                        </form>
                    </div>
                    <div class="order-2"><h4 class="font-bold text-base md:text-lg mb-3 md:mb-4 dark:text-white mt-2 lg:mt-0">Riwayat</h4><div class="max-h-[300px] md:max-h-[500px] overflow-y-auto custom-scrollbar pr-1 md:pr-2">${kompHtml || '<div class="text-center py-8 text-slate-400 text-xs md:text-sm">Kosong.</div>'}</div></div>
                </div>
            `;

            setTimeout(() => {
                div.querySelector('#isiKomplain').addEventListener('keydown', (e) => { e.stopPropagation(); });
                div.querySelector('#formKirimKomplain').addEventListener('submit', (e) => {
                    e.preventDefault();
                    runLocalAction(async () => {
                        const newId = Date.now();
                        await setDoc(getDocRef('komplain', newId), { id: newId, id_penghuni: state.loggedInUser.id, isi: document.getElementById('isiKomplain').value, status: 'Pending', tanggal: new Date().toLocaleDateString('id-ID', {day:'numeric', month:'short'}) });
                        showToast('Laporan terkirim!'); document.getElementById('formKirimKomplain').reset();
                    });
                });
            }, 0);

            return div;
        }

        window.batalKomplain = (id) => { if(confirm('Batal laporan?')) runLocalAction(async () => { await deleteDoc(getDocRef('komplain', id)); showToast('Dibatalkan.'); }); };

        initTheme(); 
        initAuth();

    </script>
</body>
</html>
