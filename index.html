<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kost Rama Modern</title>
    <!-- Tailwind CSS untuk Styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Poppins -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Poppins', 'sans-serif'] },
                    colors: {
                        primary: '#4f46e5', // Indigo 600 - Lebih modern
                        primary_hover: '#4338ca',
                        secondary: '#10b981', // Emerald 500
                        dark: '#0f172a', // Slate 900
                        darker: '#020617', // Slate 950
                        surface: '#1e293b' // Slate 800
                    },
                    animation: {
                        'fade-in': 'fadeIn 0.5s ease-out forwards',
                        'slide-up': 'slideUp 0.5s ease-out forwards',
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Poppins', sans-serif; transition: background-color 0.3s ease, color 0.3s ease; }
        
        /* Animasi Transisi & Hover Global */
        .fade-in { animation: fadeIn 0.4s cubic-bezier(0.4, 0, 0.2, 1) forwards; }
        .modal-fade-in { animation: modalFadeIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        
        /* Delay untuk animasi berurutan (Staggered) */
        .delay-100 { animation-delay: 100ms; }
        .delay-200 { animation-delay: 200ms; }
        .delay-300 { animation-delay: 300ms; }
        
        .btn-animate { transition: all 0.25s cubic-bezier(0.25, 0.8, 0.25, 1); }
        .btn-animate:hover { transform: translateY(-3px); box-shadow: 0 10px 25px -5px rgba(79, 70, 229, 0.3); }
        .btn-animate:active { transform: translateY(1px); }

        .card-hover { transition: all 0.3s ease; }
        .card-hover:hover { transform: translateY(-5px); box-shadow: 0 15px 30px -5px rgba(0, 0, 0, 0.1); }
        .dark .card-hover:hover { box-shadow: 0 15px 30px -5px rgba(0, 0, 0, 0.3); border-color: rgba(79, 70, 229, 0.5); }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes modalFadeIn { from { opacity: 0; transform: scale(0.95) translateY(10px); } to { opacity: 1; transform: scale(1) translateY(0); } }
        
        /* Toast Notification */
        #toast-container { position: fixed; bottom: 24px; right: 24px; z-index: 9999; display: flex; flex-direction: column; gap: 12px; }
        .toast { padding: 16px 24px; border-radius: 16px; color: white; font-weight: 600; box-shadow: 0 15px 30px -5px rgba(0, 0, 0, 0.2); opacity: 0; transform: translateY(100%); animation: toastSlideUp 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards, toastFadeOut 0.4s forwards 3.5s; display: flex; align-items: center; gap: 12px; backdrop-filter: blur(10px); }
        .toast.success { background: linear-gradient(135deg, #10b981, #059669); }
        .toast.error { background: linear-gradient(135deg, #ef4444, #dc2626); }
        .toast.info { background: linear-gradient(135deg, #3b82f6, #2563eb); }
        @keyframes toastSlideUp { to { opacity: 1; transform: translateY(0); } }
        @keyframes toastFadeOut { to { opacity: 0; transform: translateY(-20px); } }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .dark ::-webkit-scrollbar-thumb { background: #475569; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        /* Glassmorphism utility */
        .glass { background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.3); }
        .dark .glass { background: rgba(30, 41, 59, 0.7); border: 1px solid rgba(255, 255, 255, 0.05); }

        /* Loader */
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #4f46e5; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 20px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 dark:bg-darker dark:text-slate-100 min-h-screen antialiased selection:bg-primary selection:text-white overflow-hidden">

    <!-- Toast Container -->
    <div id="toast-container"></div>

    <!-- App Container -->
    <div id="app" class="w-full h-screen overflow-hidden flex">
        <div class="w-full h-full flex items-center justify-center">
            <div class="loader"></div>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, doc, setDoc, getDoc, getDocs, onSnapshot, deleteDoc, updateDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // ==========================================
        // 1. FIREBASE CONFIGURATION
        // ==========================================
        // Konfigurasi ini sudah diganti dengan milik Rama
        let firebaseConfig = null;
        if (typeof __firebase_config !== 'undefined' && __firebase_config) {
            try {
                firebaseConfig = JSON.parse(__firebase_config);
            } catch(e) { console.error("Error parsing __firebase_config"); }
        }

        if (!firebaseConfig) {
             firebaseConfig = {
                apiKey: "AIzaSyBM-y6dUxLLgF1z41k-vGKjclJeM7QkO3s",
                authDomain: "webkost-5a25e.firebaseapp.com",
                projectId: "webkost-5a25e",
                storageBucket: "webkost-5a25e.firebasestorage.app",
                messagingSenderId: "316395682089",
                appId: "1:316395682089:web:2286a38e4b2f843a055f38",
                measurementId: "G-4GFHKK1TN5"
            };
        }

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        
        // Setup App ID berdasarkan environment atau fallback
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'kost-Rama-app';

        // ==========================================
        // 2. STATE MANAGEMENT (FIRESTORE BASED)
        // ==========================================
        let state = {
            loggedInUser: null, // {id, username, role, nama}
            admin: [],
            penghuni: [],
            kamar: [],
            sewa: [],
            tagihan: [],
            komplain: [],
            pengumuman: [],
            isDataLoaded: false
        };

        let currentTab = 'overview';
        let unsubscribeListeners = [];

        // ==========================================
        // 3. UTILITY FUNCTIONS
        // ==========================================
        window.showToast = (message, type = 'success') => {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            let icon = '';
            if(type === 'success') icon = '<i class="ph-fill ph-check-circle text-3xl opacity-90"></i>';
            else if(type === 'error') icon = '<i class="ph-fill ph-warning-octagon text-3xl opacity-90"></i>';
            else icon = '<i class="ph-fill ph-info text-3xl opacity-90"></i>';
            
            toast.innerHTML = `${icon} <span class="tracking-wide text-sm">${message}</span>`;
            container.appendChild(toast);
            setTimeout(() => { toast.remove(); }, 4000);
        };

        window.initTheme = () => {
            const isDark = localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches);
            if (isDark) document.documentElement.classList.add('dark');
            else document.documentElement.classList.remove('dark');
        };

        window.toggleTheme = () => {
            document.documentElement.classList.toggle('dark');
            const isDark = document.documentElement.classList.contains('dark');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            render(); 
        };

        window.formatRupiah = (angka) => {
            return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(angka);
        };

        window.getAssignedRoom = (userId) => {
            // Urutkan sewa berdasarkan ID terbaru
            const sortedSewa = [...state.sewa].sort((a, b) => b.id - a.id);
            const userSewa = sortedSewa.find(s => s.id_penghuni === userId);
            return userSewa ? userSewa.id_kamar : '-';
        };

        // ==========================================
        // 4. FIREBASE INITIALIZATION & SYNC
        // ==========================================
        
        async function initAuth() {
            try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
            } catch (error) {
                console.error("Auth Error:", error);
                document.getElementById('app').innerHTML = `<div class="p-6 text-center text-red-500">Gagal terhubung ke autentikasi: ${error.message}</div>`;
            }
        }

        // Helper untuk membuat path referensi koleksi publik (Semua data kost bersifat publik agar admin/penghuni bisa saling lihat)
        const getColRef = (colName) => collection(db, 'artifacts', appId, 'public', 'data', colName);
        const getDocRef = (colName, docId) => doc(db, 'artifacts', appId, 'public', 'data', colName, String(docId));

        async function seedInitialDataIfNeeded() {
            // Cek apakah data admin sudah ada. Jika belum, buat data awal.
            const adminSnap = await getDocs(getColRef('admin'));
            if (adminSnap.empty) {
                console.log("Seeding initial data...");
                await setDoc(getDocRef('admin', 1), { id: 1, username: 'admin', password: '123', nama: 'Bapak Kost' });
                
                await setDoc(getDocRef('kamar', 101), { id: 101, fasilitas: 'Kasur, Lemari, AC, Wi-Fi', lantai: 1, ukuran: 4, harga: 800000, status: 'Terisi' });
                await setDoc(getDocRef('kamar', 102), { id: 102, fasilitas: 'Kasur, Lemari, Kipas, Jendela Luar', lantai: 1, ukuran: 3, harga: 550000, status: 'Terisi' });
                await setDoc(getDocRef('kamar', 201), { id: 201, fasilitas: 'Kasur, Meja Belajar, AC, Kamar Mandi Dalam', lantai: 2, ukuran: 5, harga: 1200000, status: 'Tersedia' });
                await setDoc(getDocRef('kamar', 202), { id: 202, fasilitas: 'Kasur, Lemari, Kipas', lantai: 2, ukuran: 3, harga: 450000, status: 'Tersedia' });
                
                await setDoc(getDocRef('penghuni', 1), { id: 1, username: 'rama', password: '123', no_hp: '08123456789', nama: 'Rama Wijaya', tgl_masuk: '2026-01-10' });
                await setDoc(getDocRef('penghuni', 2), { id: 2, username: 'budi', password: '123', no_hp: '08567890123', nama: 'Budi Santoso', tgl_masuk: '2026-03-15' });
                
                await setDoc(getDocRef('sewa', 1), { id: 1, id_penghuni: 1, id_kamar: 101 });
                await setDoc(getDocRef('sewa', 2), { id: 2, id_penghuni: 2, id_kamar: 102 });
                
                await setDoc(getDocRef('tagihan', 1), { id: 1, id_penghuni: 1, id_kamar: 101, nominal: 800000, status_bayar: 'Belum Lunas', metode: null, tanggal: new Date().toISOString().split('T')[0] });
                await setDoc(getDocRef('tagihan', 2), { id: 2, id_penghuni: 2, id_kamar: 102, nominal: 550000, status_bayar: 'Lunas', metode: 'Transfer BCA', tanggal: '2026-04-01' });
                
                await setDoc(getDocRef('komplain', 1), { id: 1, id_penghuni: 2, isi: 'Air di kamar mandi lantai 1 mampet pak.', status: 'Pending', tanggal: 'Baru saja' });
                
                await setDoc(getDocRef('pengumuman', 1), { id: 1, judul: 'Pembersihan AC Rutin', isi: 'Halo semuanya, besok pagi jam 09.00 akan ada tukang AC yang datang. Mohon kerjasamanya ya.', tanggal: 'Hari ini', tipe: 'info' });
                console.log("Seeding done.");
            }
        }

        function setupListeners() {
            // Bersihkan listener lama jika ada
            unsubscribeListeners.forEach(unsub => unsubscribe());
            unsubscribeListeners = [];

            const collectionsToSync = ['admin', 'penghuni', 'kamar', 'sewa', 'tagihan', 'komplain', 'pengumuman'];
            
            // Variabel untuk mengecek apakah load pertama dari semua listener sudah selesai
            let loadedCount = 0;
            
            collectionsToSync.forEach(colName => {
                const unsub = onSnapshot(getColRef(colName), (snapshot) => {
                    const data = [];
                    snapshot.forEach(doc => data.push(doc.data()));
                    state[colName] = data;
                    
                    if (!state.isDataLoaded) {
                        loadedCount++;
                        if (loadedCount === collectionsToSync.length) {
                            state.isDataLoaded = true;
                            render();
                        }
                    } else {
                        // Jika sudah loaded dan ada perubahan, render ulang UI
                        render();
                    }
                }, (error) => {
                    console.error(`Error listening to ${colName}:`, error);
                    showToast(`Error sinkronisasi data ${colName}`, 'error');
                });
                unsubscribeListeners.push(unsub);
            });
        }

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                // Jangan mulai sinkronisasi jika config kosong (mencegah error permissions)
                if (firebaseConfig.apiKey === "") {
                    document.getElementById('app').innerHTML = `<div class="p-8 text-center"><h2 class="text-xl font-bold text-red-500 mb-2">Setup Required</h2><p>Please update <code>firebaseConfig</code> with your actual Firebase project settings.</p></div>`;
                    return;
                }
                
                await seedInitialDataIfNeeded();
                setupListeners();
            }
        });


        // ==========================================
        // 5. MAIN RENDERER
        // ==========================================
        function render() {
            if (!state.isDataLoaded) return; // Tunggu data Firebase siap

            const app = document.getElementById('app');
            app.innerHTML = ''; 

            if (!state.loggedInUser) {
                app.appendChild(LoginView());
            } else {
                app.appendChild(MainLayout());
            }
        }

        // ==========================================
        // 6. VIEWS (COMPONENTS)
        // ==========================================

        // --- LOGIN VIEW ---
        function LoginView() {
            const div = document.createElement('div');
            div.className = 'w-full h-full flex items-center justify-center p-6 fade-in relative overflow-hidden';
            
            div.innerHTML = `
                <div class="absolute inset-0 bg-slate-50 dark:bg-darker z-0">
                    <div class="absolute top-[-20%] left-[-10%] w-[600px] h-[600px] bg-primary/20 rounded-full blur-[100px] mix-blend-multiply dark:mix-blend-lighten animate-pulse" style="animation-duration: 4s;"></div>
                    <div class="absolute bottom-[-20%] right-[-10%] w-[500px] h-[500px] bg-secondary/20 rounded-full blur-[100px] mix-blend-multiply dark:mix-blend-lighten animate-pulse" style="animation-duration: 5s;"></div>
                </div>

                <div class="relative z-10 w-full max-w-md glass p-10 rounded-[2rem] shadow-2xl">
                    <div class="text-center mb-10">
                        <div class="inline-flex p-4 bg-gradient-to-tr from-primary to-indigo-400 rounded-2xl mb-5 shadow-lg shadow-primary/30 transform rotate-3">
                            <i class="ph-fill ph-buildings text-4xl text-white"></i>
                        </div>
                        <h1 class="text-3xl font-extrabold text-slate-800 dark:text-white tracking-tight mb-2">Kost Rama</h1>
                        <p class="text-slate-500 dark:text-slate-400 text-sm font-medium">Sistem Manajemen Kost Cerdas</p>
                    </div>
                    
                    <form id="loginForm" class="space-y-6">
                        <div>
                            <label class="block text-sm font-semibold mb-2 text-slate-700 dark:text-slate-300">Username</label>
                            <div class="relative group">
                                <i class="ph ph-user absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 text-lg group-focus-within:text-primary transition-colors"></i>
                                <input type="text" id="username" placeholder="Masukkan username" required class="w-full pl-12 pr-4 py-3.5 rounded-xl bg-white/50 dark:bg-slate-900/50 border border-slate-200 dark:border-slate-700 focus:ring-2 focus:ring-primary focus:border-primary outline-none transition-all text-slate-800 dark:text-white backdrop-blur-sm">
                            </div>
                        </div>
                        <div>
                            <label class="block text-sm font-semibold mb-2 text-slate-700 dark:text-slate-300">Password</label>
                            <div class="relative group">
                                <i class="ph ph-lock-key absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 text-lg group-focus-within:text-primary transition-colors"></i>
                                <input type="password" id="password" placeholder="••••••••" required class="w-full pl-12 pr-12 py-3.5 rounded-xl bg-white/50 dark:bg-slate-900/50 border border-slate-200 dark:border-slate-700 focus:ring-2 focus:ring-primary focus:border-primary outline-none transition-all text-slate-800 dark:text-white backdrop-blur-sm">
                                <button type="button" id="togglePasswordBtn" class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-primary transition-colors p-2 rounded-lg">
                                    <i id="togglePasswordIcon" class="ph ph-eye-slash text-xl"></i>
                                </button>
                            </div>
                        </div>
                        <div>
                            <label class="block text-sm font-semibold mb-2 text-slate-700 dark:text-slate-300">Akses Masuk</label>
                            <div class="relative group">
                                <i class="ph ph-shield-check absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 text-lg group-focus-within:text-primary transition-colors"></i>
                                <select id="role" class="w-full pl-12 pr-4 py-3.5 rounded-xl bg-white/50 dark:bg-slate-900/50 border border-slate-200 dark:border-slate-700 focus:ring-2 focus:ring-primary focus:border-primary outline-none transition-all text-slate-800 dark:text-white appearance-none cursor-pointer backdrop-blur-sm font-medium">
                                    <option value="Admin">🔑 Admin Kost</option>
                                    <option value="Penghuni">👤 Penghuni Kamar</option>
                                </select>
                                <i class="ph ph-caret-down absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none"></i>
                            </div>
                        </div>
                        <button type="submit" class="btn-animate w-full py-4 mt-8 bg-gradient-to-r from-primary to-indigo-500 text-white font-bold rounded-xl flex justify-center items-center gap-2 shadow-lg shadow-primary/30">
                            <span class="tracking-wide">MASUK SEKARANG</span> <i class="ph-bold ph-arrow-right"></i>
                        </button>
                    </form>
                </div>
            `;

            // Logic Show/Hide Password
            const toggleBtn = div.querySelector('#togglePasswordBtn');
            const passInput = div.querySelector('#password');
            const toggleIcon = div.querySelector('#togglePasswordIcon');
            
            toggleBtn.addEventListener('click', () => {
                if (passInput.type === 'password') {
                    passInput.type = 'text';
                    toggleIcon.className = 'ph-fill ph-eye text-xl text-primary';
                } else {
                    passInput.type = 'password';
                    toggleIcon.className = 'ph ph-eye-slash text-xl text-slate-400';
                }
            });

            // Logic Submit Login
            div.querySelector('#loginForm').addEventListener('submit', (e) => {
                e.preventDefault();
                const u = div.querySelector('#username').value.trim();
                const p = div.querySelector('#password').value.trim();
                const r = div.querySelector('#role').value.replace('🔑 ', '').replace('👤 ', '').replace(' Kost', '').replace(' Kamar', '').trim();

                let userFound = null;
                if (r === 'Admin') userFound = state.admin.find(x => x.username === u && x.password === p);
                else userFound = state.penghuni.find(x => x.username === u && x.password === p);

                if (userFound) {
                    state.loggedInUser = { id: userFound.id, username: userFound.username, role: r, nama: userFound.nama || userFound.username };
                    currentTab = 'overview'; 
                    showToast(`Selamat datang kembali, ${state.loggedInUser.nama}!`, 'success');
                    render();
                } else {
                    showToast('Username atau Password Salah!', 'error');
                }
            });

            return div;
        }

        // --- MAIN LAYOUT (SIDEBAR + CONTENT) ---
        function MainLayout() {
            const container = document.createElement('div');
            container.className = 'flex w-full h-full overflow-hidden bg-slate-50 dark:bg-darker';

            const isAdmin = state.loggedInUser.role === 'Admin';
            
            const menus = isAdmin ? [
                { id: 'overview', icon: 'ph-squares-four', label: 'Overview' },
                { id: 'kamar', icon: 'ph-door', label: 'Kamar Kost' },
                { id: 'penghuni', icon: 'ph-users', label: 'Penghuni' },
                { id: 'tagihan', icon: 'ph-wallet', label: 'Tagihan' },
                { id: 'komplain', icon: 'ph-chat-circle-text', label: 'Komplain' },
                { id: 'pengumuman', icon: 'ph-megaphone', label: 'Pengumuman' },
            ] : [
                { id: 'overview', icon: 'ph-house', label: 'Beranda' },
                { id: 'tagihan', icon: 'ph-receipt', label: 'Tagihan Saya' },
                { id: 'komplain', icon: 'ph-headset', label: 'Pusat Bantuan' },
            ];

            let sidebarMenus = menus.map(m => `
                <button onclick="changeTab('${m.id}')" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl mb-1.5 transition-all ${currentTab === m.id ? 'bg-primary text-white font-semibold shadow-md shadow-primary/20' : 'text-slate-500 hover:bg-slate-100 dark:text-slate-400 dark:hover:bg-slate-800/50 hover:text-slate-800 dark:hover:text-white font-medium'}">
                    <i class="${currentTab === m.id ? 'ph-fill' : 'ph'} ${m.icon} text-xl"></i>
                    <span>${m.label}</span>
                </button>
            `).join('');

            const sidebar = document.createElement('aside');
            sidebar.className = 'w-64 flex-shrink-0 border-r border-slate-200 dark:border-slate-800 bg-white dark:bg-surface hidden md:flex flex-col z-20';
            sidebar.innerHTML = `
                <div class="h-20 flex items-center px-6 border-b border-slate-100 dark:border-slate-800">
                    <div class="flex items-center gap-3 text-primary">
                        <i class="ph-fill ph-buildings text-3xl"></i>
                        <span class="text-xl font-extrabold tracking-tight text-slate-800 dark:text-white">Kost Rama</span>
                    </div>
                </div>
                <div class="flex-1 overflow-y-auto p-4 custom-scrollbar">
                    <p class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-4 px-2">Menu Utama</p>
                    ${sidebarMenus}
                </div>
                <div class="p-4 border-t border-slate-100 dark:border-slate-800">
                    <div class="flex items-center gap-3 mb-4 px-2">
                        <div class="w-10 h-10 rounded-full bg-gradient-to-tr from-primary to-indigo-400 text-white flex items-center justify-center font-bold shadow-sm">
                            ${state.loggedInUser.username.charAt(0).toUpperCase()}
                        </div>
                        <div class="overflow-hidden">
                            <p class="text-sm font-bold text-slate-800 dark:text-white truncate">${state.loggedInUser.nama || state.loggedInUser.username}</p>
                            <p class="text-xs text-slate-500 dark:text-slate-400 truncate">${state.loggedInUser.role}</p>
                        </div>
                    </div>

            const isDark = document.documentElement.classList.contains('dark');
            const topbar = `
                <header class="h-20 glass flex items-center justify-between px-6 z-10">

                        <div>
                            <h2 class="text-xl font-bold text-slate-800 dark:text-white capitalize">${currentTab.replace('_', ' ')}</h2>
                            <p class="text-xs text-slate-500 dark:text-slate-400">${new Date().toLocaleDateString('id-ID', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' })}</p>

                    <button onclick="toggleTheme()" class="btn-animate p-2.5 rounded-full bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-yellow-400 hover:bg-slate-200 dark:hover:bg-slate-700 transition-colors">
                        <i id="themeIconMain" class="${isDark ? 'ph-fill ph-sun text-yellow-400' : 'ph-fill ph-moon text-slate-700'} text-xl"></i>

            `;

            const contentWrapper = document.createElement('div');
            contentWrapper.className = 'flex-1 overflow-y-auto p-4 md:p-8 custom-scrollbar fade-in relative';
            
            let contentEl = null;
            if(isAdmin) {
                if(currentTab === 'overview') contentEl = renderAdminOverview();
                else if(currentTab === 'kamar') contentEl = renderAdminKamar();
                else if(currentTab === 'penghuni') contentEl = renderAdminPenghuni();
                else if(currentTab === 'tagihan') contentEl = renderAdminTagihan();
                else if(currentTab === 'komplain') contentEl = renderAdminKomplain();
                else if(currentTab === 'pengumuman') contentEl = renderAdminPengumuman();
            } else {
                if(currentTab === 'overview') contentEl = renderPenghuniOverview();
                else if(currentTab === 'tagihan') contentEl = renderPenghuniTagihan();
                else if(currentTab === 'komplain') contentEl = renderPenghuniKomplain();
            }

            mainArea.innerHTML = topbar;
            if(contentEl) contentWrapper.appendChild(contentEl);
            mainArea.appendChild(contentWrapper);

            container.appendChild(sidebar);
            container.appendChild(mainArea);
            return container;
        }

        window.changeTab = (tabId) => {
            currentTab = tabId;
            render();
        }

        window.doLogout = () => {
            state.loggedInUser = null;
            currentTab = 'overview';
            showToast('Berhasil Logout. Sampai jumpa! 👋', 'info');
            render();
        }

        // ==========================================
        // FIREBASE DB ACTIONS (ADMIN)
        // ==========================================
        
        function renderAdminOverview() {
            const div = document.createElement('div');
            const totalKamar = state.kamar.length;
            const kamarTerisi = state.kamar.filter(k => k.status === 'Terisi').length;
            const persentase = totalKamar === 0 ? 0 : Math.round((kamarTerisi / totalKamar) * 100);
            
            const pendapatan = state.tagihan.filter(t => t.status_bayar === 'Lunas').reduce((sum, t) => sum + t.nominal, 0);
            const komplainPending = state.komplain.filter(k => k.status === 'Pending').length;

            div.innerHTML = `
                <div class="mb-8 fade-in delay-100">
                    <h3 class="text-2xl font-bold dark:text-white mb-2">Selamat Datang, ${state.loggedInUser.nama}! 👋</h3>
                    <p class="text-slate-500 dark:text-slate-400">Berikut adalah ringkasan performa kost hari ini.</p>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-8 fade-in delay-200">

                    <div class="bg-white dark:bg-surface p-6 rounded-2xl border border-slate-100 dark:border-slate-800 shadow-sm relative overflow-hidden group">
                        <div class="absolute -right-4 -top-4 w-24 h-24 bg-primary/10 rounded-full blur-xl group-hover:bg-primary/20 transition-all"></div>
                        <p class="text-slate-500 dark:text-slate-400 text-sm font-semibold mb-2">Tingkat Keterisian</p>

                        <div class="w-full bg-slate-100 dark:bg-slate-700 h-2.5 rounded-full overflow-hidden">
                            <div class="bg-primary h-full rounded-full" style="width: ${persentase}%"></div>
                        </div>
                        <p class="text-xs text-slate-400 mt-3">${kamarTerisi} dari ${totalKamar} Kamar Terisi</p>
                    </div>

                    <!-- Card 2: Penghuni -->
                    <div class="bg-white dark:bg-surface p-6 rounded-2xl border border-slate-100 dark:border-slate-800 shadow-sm">
                        <div class="flex justify-between items-start mb-4">
                            <div>
                                <p class="text-slate-500 dark:text-slate-400 text-sm font-semibold mb-1">Total Penghuni</p>
                                <h4 class="text-3xl font-extrabold dark:text-white">${state.penghuni.length}</h4>
                            </div>
                            <div class="p-3 bg-blue-50 dark:bg-blue-500/10 text-primary rounded-xl"><i class="ph-fill ph-users text-2xl"></i></div>
                        </div>
                        <p class="text-xs text-green-500 font-medium flex items-center gap-1"><i class="ph-bold ph-trend-up"></i> Aktif menyewa</p>
                    </div>

                    <!-- Card 3: Pendapatan -->
                    <div class="bg-white dark:bg-surface p-6 rounded-2xl border border-slate-100 dark:border-slate-800 shadow-sm">
                        <div class="flex justify-between items-start mb-4">
                            <div>
                                <p class="text-slate-500 dark:text-slate-400 text-sm font-semibold mb-1">Pendapatan Diterima</p>
                                <h4 class="text-2xl font-extrabold text-secondary">${formatRupiah(pendapatan)}</h4>
                            </div>
                            <div class="p-3 bg-green-50 dark:bg-green-500/10 text-secondary rounded-xl"><i class="ph-fill ph-wallet text-2xl"></i></div>
                        </div>
                        <p class="text-xs text-slate-400">Total dari tagihan lunas</p>
                    </div>

                    <!-- Card 4: Action Needed -->
                    <div class="bg-gradient-to-br from-rose-500 to-red-600 p-6 rounded-2xl shadow-lg shadow-red-500/30 text-white flex flex-col justify-between">
                        <div>
                            <p class="text-red-100 text-sm font-semibold mb-1">Butuh Tindakan</p>

                            <p class="text-sm text-red-100">Komplain belum diselesaikan</p>

                        <button onclick="changeTab('komplain')" class="btn-animate mt-4 w-full py-2 bg-white/20 hover:bg-white/30 backdrop-blur rounded-xl text-sm font-bold transition">Cek Sekarang</button>
                    </div>
                </div>
            `;
            return div;
        }

        function renderAdminKamar() {
            const div = document.createElement('div');
            
            let kamarCards = '';
            // Sorting kamar berdasarkan ID untuk kerapian
            const sortedKamar = [...state.kamar].sort((a, b) => a.id - b.id);

            sortedKamar.forEach((k, index) => {
                const isTerisi = k.status === 'Terisi';
                const statusColor = isTerisi ? 'bg-rose-50 text-red-600 border-red-200 dark:bg-red-500/10 dark:text-red-400 dark:border-red-500/20' : 'bg-emerald-50 text-emerald-600 border-emerald-200 dark:bg-emerald-500/10 dark:text-emerald-400 dark:border-emerald-500/20';
                const statusIcon = isTerisi ? 'ph-prohibit' : 'ph-check-circle';
                
                const fasArray = k.fasilitas.split(',').map(f => f.trim()).slice(0, 3);
                let fasBadges = fasArray.map(f => `<span class="px-2 py-1 bg-slate-100 dark:bg-slate-700/50 text-slate-500 dark:text-slate-400 text-xs rounded-md whitespace-nowrap">${f}</span>`).join('');
                if(k.fasilitas.split(',').length > 3) fasBadges += `<span class="px-2 py-1 bg-slate-100 dark:bg-slate-700/50 text-slate-500 dark:text-slate-400 text-xs rounded-md">+ lain</span>`;

                const delay = (index % 4) * 100;

                kamarCards += `
                    <div class="bg-white dark:bg-surface rounded-2xl border border-slate-200 dark:border-slate-700 p-5 flex flex-col justify-between card-hover fade-in" style="animation-delay: ${delay}ms;">
                        <div>
                            <div class="flex justify-between items-start mb-4">
                                <div class="flex items-center gap-3">
                                    <div class="w-12 h-12 bg-primary/10 text-primary rounded-xl flex items-center justify-center font-bold text-xl"><i class="ph-fill ph-door"></i></div>
                                    <div>
                                        <h3 class="text-xl font-bold dark:text-white">Kmr ${k.id}</h3>
                                        <p class="text-xs text-slate-500">Lantai ${k.lantai} • ${k.ukuran}m²</p>
                                    </div>
                                </div>
                                <span class="flex items-center gap-1.5 px-2.5 py-1 border rounded-lg text-xs font-bold ${statusColor}"><i class="ph-bold ${statusIcon}"></i> ${k.status}</span>
                            </div>
                            <div class="mb-5">
                                <p class="text-xs font-semibold text-slate-400 mb-2 uppercase tracking-wide">Fasilitas Utama</p>
                                <div class="flex flex-wrap gap-1.5">${fasBadges}</div>
                            </div>
                        </div>
                        <div class="mt-auto pt-4 border-t border-slate-100 dark:border-slate-800 flex justify-between items-center">
                            <p class="font-bold text-primary dark:text-indigo-400">${formatRupiah(k.harga)}<span class="text-xs text-slate-400 font-normal">/bln</span></p>
                            <div class="flex gap-1.5">
                                <button onclick="ubahStatusKamar(${k.id})" class="btn-animate p-2 bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 text-slate-600 dark:text-slate-300 rounded-lg transition" title="Ubah Status"><i class="ph-bold ph-arrows-left-right"></i></button>
                                <button onclick="hapusKamar(${k.id})" class="btn-animate p-2 bg-rose-50 hover:bg-red-100 dark:bg-red-500/10 dark:hover:bg-red-500/20 text-red-600 rounded-lg transition" title="Hapus Kamar"><i class="ph-bold ph-trash"></i></button>
                            </div>
                        </div>
                    </div>
                `;
            });

            div.innerHTML = `
                <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-6 gap-4 fade-in">
                    <div>
                        <h3 class="text-xl font-bold dark:text-white">Manajemen Kamar</h3>
                        <p class="text-sm text-slate-500">Kelola data dan status seluruh kamar kost.</p>
                    </div>
                    <button onclick="document.getElementById('modalTambahKamar').classList.remove('hidden')" class="btn-animate bg-primary hover:bg-primary_hover text-white px-5 py-2.5 rounded-xl font-bold flex items-center gap-2 shadow-lg shadow-primary/30">
                        <i class="ph-bold ph-plus"></i> Tambah Kamar Baru
                    </button>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6">
                    ${kamarCards || '<p class="col-span-full text-center text-slate-500 py-10">Belum ada data kamar.</p>'}
                </div>

                <!-- MODAL TAMBAH KAMAR -->
                <div id="modalTambahKamar" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-slate-900/50 backdrop-blur-sm">
                    <div class="bg-white dark:bg-surface p-6 md:p-8 rounded-3xl shadow-2xl w-full max-w-lg m-4 border border-slate-200 dark:border-slate-700 modal-fade-in">
                        <div class="flex justify-between items-center mb-6">
                            <h3 class="text-xl font-bold dark:text-white flex items-center gap-2"><i class="ph-fill ph-door text-primary"></i> Tambah Kamar</h3>
                            <button onclick="document.getElementById('modalTambahKamar').classList.add('hidden')" class="p-2 bg-slate-100 dark:bg-slate-800 rounded-full hover:bg-slate-200 dark:text-white"><i class="ph-bold ph-x"></i></button>
                        </div>
                        <form id="formTambahKamar" class="space-y-4">
                            <div class="grid grid-cols-2 gap-4">
                                <div><label class="block text-sm font-medium mb-1 dark:text-slate-300">No Kamar</label><input type="number" id="k_id" required class="w-full px-4 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 focus:ring-2 focus:ring-primary outline-none dark:text-white"></div>
                                <div><label class="block text-sm font-medium mb-1 dark:text-slate-300">Lantai</label><input type="number" id="k_lantai" required min="1" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 focus:ring-2 focus:ring-primary outline-none dark:text-white"></div>
                            </div>
                            <div class="grid grid-cols-2 gap-4">
                                <div><label class="block text-sm font-medium mb-1 dark:text-slate-300">Harga (Rp)</label><input type="number" id="k_harga" required min="0" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 focus:ring-2 focus:ring-primary outline-none dark:text-white"></div>
                                <div><label class="block text-sm font-medium mb-1 dark:text-slate-300">Ukuran (m²)</label><input type="number" id="k_ukuran" required min="1" placeholder="Misal: 12" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 focus:ring-2 focus:ring-primary outline-none dark:text-white"></div>
                            </div>
                            <div><label class="block text-sm font-medium mb-1 dark:text-slate-300">Fasilitas (Pisahkan koma)</label><textarea id="k_fasilitas" required placeholder="Kasur, Lemari, AC..." class="w-full px-4 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 focus:ring-2 focus:ring-primary outline-none dark:text-white resize-none h-20"></textarea></div>
                            
                            <button type="submit" class="btn-animate w-full bg-primary text-white py-3.5 rounded-xl font-bold mt-4 shadow-lg shadow-primary/30">Simpan Kamar</button>
                        </form>
                    </div>
                </div>
            `;

            setTimeout(() => {
                div.querySelector('#formTambahKamar').addEventListener('submit', async (e) => {
                    e.preventDefault();
                    const id = parseInt(document.getElementById('k_id').value);
                    if (state.kamar.find(k => k.id === id)) return showToast('Nomor Kamar sudah digunakan!', 'error');
                    
                    const newKamar = {
                        id,
                        fasilitas: document.getElementById('k_fasilitas').value,
                        lantai: parseInt(document.getElementById('k_lantai').value),
                        ukuran: parseFloat(document.getElementById('k_ukuran').value), 
                        harga: parseInt(document.getElementById('k_harga').value),
                        status: 'Tersedia'
                    };

                    try {
                        await setDoc(getDocRef('kamar', id), newKamar);
                        document.getElementById('modalTambahKamar').classList.add('hidden');
                        showToast('Kamar berhasil ditambahkan!');
                    } catch (error) {
                        console.error(error);
                        showToast('Gagal menyimpan kamar', 'error');
                    }
                });
            }, 0);

            return div;
        }

        window.ubahStatusKamar = async (id) => {
            let k = state.kamar.find(x => x.id === id);
            if (!k) return;
            const newStatus = k.status === 'Tersedia' ? 'Terisi' : 'Tersedia';
            
            try {
                await updateDoc(getDocRef('kamar', id), { status: newStatus });
                showToast(`Status Kamar ${id} sukses diubah!`);
            } catch (error) {
                console.error(error);
                showToast('Gagal mengubah status kamar', 'error');
            }
        };

        window.hapusKamar = async (id) => {
            if(state.sewa.find(s => s.id_kamar === id)) return showToast('Tidak bisa dihapus: Kamar masih tercatat di riwayat sewa penghuni.', 'error');
            if(confirm(`Yakin ingin menghapus Kamar ${id} secara permanen?`)) {
                try {
                    await deleteDoc(getDocRef('kamar', id));
                    showToast('Kamar berhasil dihapus!', 'success');
                } catch (error) {
                    console.error(error);
                    showToast('Gagal menghapus kamar', 'error');
                }
            }
        };

        window.showModalPindahKamar = (idPenghuni) => {
            const p = state.penghuni.find(x => x.id === idPenghuni);
            const kamarTersedia = state.kamar.filter(k => k.status === 'Tersedia');

            if(kamarTersedia.length === 0) {
                return showToast('Waduh, tidak ada kamar kosong saat ini!', 'error');
            }

            let optHtml = kamarTersedia.map(k => `<option value="${k.id}">Kamar ${k.id} (Lt.${k.lantai}) - ${formatRupiah(k.harga)}</option>`).join('');

            const modalHtml = `
                <div id="customModal" class="fixed inset-0 z-[100] flex items-center justify-center bg-slate-900/60 backdrop-blur-sm transition-opacity duration-300">
                    <div class="bg-white dark:bg-slate-800 p-6 md:p-8 rounded-3xl shadow-2xl border border-slate-200 dark:border-slate-700 w-full max-w-md m-4 modal-fade-in">
                        <div class="flex items-center gap-3 mb-2">
                            <div class="p-2.5 bg-blue-100 dark:bg-blue-500/20 text-primary rounded-xl"><i class="ph-bold ph-truck text-2xl"></i></div>
                            <h3 class="text-2xl font-bold dark:text-white">Pindah Kamar</h3>
                        </div>
                        <p class="text-sm text-slate-500 dark:text-slate-400 mb-6">Pilih kamar tujuan baru untuk penghuni <b>${p.nama || p.username}</b>.</p>
                        
                        <label class="block text-sm font-semibold mb-1.5 text-slate-700 dark:text-slate-300">Pilih Kamar Tersedia</label>
                        <select id="selectKamarBaru" class="w-full px-4 py-3.5 rounded-xl border border-slate-200 dark:border-slate-600 bg-slate-50 dark:bg-slate-900/50 outline-none focus:ring-2 focus:ring-primary dark:text-white appearance-none cursor-pointer mb-8">
                            ${optHtml}
                        </select>
                        
                        <div class="flex gap-3 justify-end">
                            <button onclick="closeModal()" class="btn-animate px-5 py-3 rounded-xl font-bold text-slate-600 bg-slate-100 hover:bg-slate-200 dark:text-slate-300 dark:bg-slate-700 dark:hover:bg-slate-600">Batal</button>
                            <button onclick="prosesPindahKamar(${idPenghuni})" class="btn-animate px-6 py-3 rounded-xl font-bold text-white bg-primary hover:bg-blue-600 flex items-center gap-2"><i class="ph-bold ph-check"></i> Konfirmasi</button>
                        </div>
                    </div>
                </div>
            `;
            document.body.insertAdjacentHTML('beforeend', modalHtml);
        };

        window.closeModal = () => {
            const m = document.getElementById('customModal');
            if(m) {
                m.classList.remove('modal-fade-in');
                m.style.opacity = '0';
                setTimeout(() => m.remove(), 300);
            }
        };

        window.prosesPindahKamar = async (idPenghuni) => {
            const el = document.getElementById('selectKamarBaru');
            if(!el) return;
            const newKamarId = parseInt(el.value);
            const kamarLamaId = getAssignedRoom(idPenghuni);
            
            try {
                // Proses update batch secara manual (Firestore batch di-skip untuk kesederhanaan, menggunakan update berurutan)
                if(kamarLamaId !== '-') {
                    await updateDoc(getDocRef('kamar', kamarLamaId), { status: 'Tersedia' });
                }
                
                await updateDoc(getDocRef('kamar', newKamarId), { status: 'Terisi' });

                // Update riwayat sewa terakhir atau tambah baru
                const sortedSewa = [...state.sewa].sort((a, b) => b.id - a.id);
                const userSewa = sortedSewa.find(s => s.id_penghuni === idPenghuni);
                
                if(userSewa) {
                    await updateDoc(getDocRef('sewa', userSewa.id), { id_kamar: newKamarId });
                } else {
                    const newSewaId = Date.now();
                    await setDoc(getDocRef('sewa', newSewaId), { id: newSewaId, id_penghuni: idPenghuni, id_kamar: newKamarId });
                }

                closeModal();
                showToast(`Sip! Penghuni berhasil pindah ke Kamar ${newKamarId} 🚚`, 'success');
            } catch (error) {
                console.error(error);
                showToast('Gagal memproses pindah kamar', 'error');
            }
        };

            const div = document.createElement('div');
            
            let tbody = '';
            state.penghuni.forEach(p => {
                const kamarUser = getAssignedRoom(p.id);
                const isKamarAktif = kamarUser !== '-';
                tbody += `
                    <tr class="border-b border-slate-100 dark:border-slate-800 hover:bg-slate-50 dark:hover:bg-slate-800/50">
                        <td class="p-4 font-mono text-xs text-slate-400">P-${p.id}</td>
                        <td class="p-4">
                            <div class="flex items-center gap-3">
                                <div class="w-9 h-9 rounded-full bg-primary/10 text-primary flex items-center justify-center font-bold text-sm uppercase">${p.username.charAt(0)}</div>
                                <div>
                                    <p class="font-bold text-slate-800 dark:text-slate-200 capitalize">${p.nama || p.username}</p>

                                ${isKamarAktif ? `Kmr ${kamarUser}` : 'Kosong'}
                            </span>
                        </td>
                        <td class="p-4 flex gap-2">
                            <button onclick="showModalPindahKamar(${p.id})" class="btn-animate px-3 py-1.5 bg-blue-50 dark:bg-blue-500/10 text-primary border border-blue-100 dark:border-blue-500/20 rounded-lg text-sm font-semibold hover:bg-primary hover:text-white transition">Pindah</button>
                            <button onclick="hapusPenghuni(${p.id})" class="btn-animate px-3 py-1.5 bg-rose-50 dark:bg-red-500/10 text-red-600 border border-rose-100 dark:border-red-500/20 rounded-lg text-sm font-semibold hover:bg-red-500 hover:text-white transition">Check-Out</button>
                        </td>
                    </tr>
                `;
            });

            if(tbody === '') tbody = '<tr><td colspan="5" class="p-8 text-center text-slate-500">Belum ada penghuni aktif.</td></tr>';

            const kamarTersedia = state.kamar.filter(k => k.status === 'Tersedia');
            let optionsKamar = kamarTersedia.map(k => `<option value="${k.id}">Kamar ${k.id} - ${formatRupiah(k.harga)}</option>`).join('');
            if(optionsKamar === '') optionsKamar = '<option disabled selected>⚠️ Waduh, semua kamar penuh!</option>';

            div.innerHTML = `

                    // Menghapus data-data terkait secara berurutan

                    for (let t of userTagihan) await deleteDoc(getDocRef('tagihan', t.id));
                    
                    const userKomplain = state.komplain.filter(k => k.id_penghuni === id);
                    for (let k of userKomplain) await deleteDoc(getDocRef('komplain', k.id));
                    
                    const userSewa = state.sewa.filter(s => s.id_penghuni === id);

                    await deleteDoc(getDocRef('penghuni', id));

                            <h4 class="font-extrabold text-lg dark:text-white text-slate-800">${latest.judul}</h4>
                            <p class="text-sm mt-1 text-slate-600 dark:text-slate-300 leading-relaxed">${latest.isi}</p>
                        </div>
                    </div>
                `;
            }

            div.innerHTML = `
                ${pengumumanHtml}
                
                <h3 class="text-2xl font-bold dark:text-white mb-6 fade-in delay-100">Ringkasan Kost Kamu</h3>
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6 fade-in delay-200">
                    <!-- Status Kamar -->
                    <div class="bg-white dark:bg-surface rounded-3xl p-6 border border-slate-200 dark:border-slate-700 shadow-sm relative overflow-hidden group">
                        <div class="absolute -right-6 -bottom-6 opacity-5 dark:opacity-10 group-hover:scale-110 transition-transform duration-500"><i class="ph-fill ph-door text-9xl"></i></div>
                        <div class="flex items-center gap-3 mb-4">
                            <div class="w-10 h-10 bg-primary/10 text-primary rounded-xl flex justify-center items-center"><i class="ph-bold ph-bed text-xl"></i></div>
                            <h4 class="font-bold text-slate-500 dark:text-slate-400">Kamar Saat Ini</h4>
                        </div>
                        <h2 class="text-5xl font-black text-slate-800 dark:text-white mb-2">${kamarSaya !== '-' ? kamarSaya : '<span class="text-2xl">Belum ada</span>'}</h2>
                        <p class="text-sm text-green-500 font-semibold flex items-center gap-1"><i class="ph-fill ph-check-circle"></i> Status Aktif</p>
                    </div>

                    <!-- Status Tagihan -->
                    <div class="bg-white dark:bg-surface rounded-3xl p-6 border border-slate-200 dark:border-slate-700 shadow-sm relative overflow-hidden group">
                        <div class="absolute -right-6 -bottom-6 opacity-5 dark:opacity-10 group-hover:scale-110 transition-transform duration-500"><i class="ph-fill ph-receipt text-9xl"></i></div>
                        <div class="flex justify-between items-start mb-4">
                            <div class="flex items-center gap-3">
                                <div class="w-10 h-10 bg-rose-100 dark:bg-red-500/20 text-red-500 rounded-xl flex justify-center items-center"><i class="ph-bold ph-wallet text-xl"></i></div>
                                <h4 class="font-bold text-slate-500 dark:text-slate-400">Tagihan Aktif</h4>
                            </div>
                        </div>
                        ${tagihanBelumLunas.length > 0 ? `
                            <h2 class="text-4xl font-black text-slate-800 dark:text-white mb-2">${formatRupiah(tagihanBelumLunas[0].nominal)}</h2>
                            <button onclick="changeTab('tagihan')" class="text-sm text-primary font-bold hover:underline">Bayar Sekarang &rarr;</button>
                        ` : `
                            <h2 class="text-3xl font-black text-slate-800 dark:text-white mb-2">Rp 0</h2>
                            <p class="text-sm text-green-500 font-semibold flex items-center gap-1"><i class="ph-fill ph-smiley"></i> Yeay! Semua lunas.</p>
                        `}
                    </div>
                </div>

                <div class="mt-8 bg-slate-800 dark:bg-primary text-white rounded-3xl p-8 flex flex-col md:flex-row items-center justify-between gap-6 shadow-xl fade-in delay-300 overflow-hidden relative">
                    <div class="absolute inset-0 bg-[url('https://www.transparenttextures.com/patterns/cubes.png')] opacity-20 mix-blend-overlay"></div>
                    <div class="relative z-10 text-center md:text-left">
                        <h3 class="text-2xl font-bold mb-2">Ada masalah di kamar kost?</h3>
                        <p class="text-slate-300 dark:text-blue-100">Jangan ragu hubungi Admin. Kami siap bantu perbaiki kerusakan secepatnya.</p>
                    </div>
                    <button onclick="changeTab('komplain')" class="relative z-10 btn-animate shrink-0 px-6 py-3 bg-white text-slate-800 dark:text-primary font-bold rounded-xl shadow-lg flex items-center gap-2">Buat Laporan <i class="ph-bold ph-arrow-right"></i></button>
                </div>
            `;
            return div;
        }

        function renderPenghuniTagihan() {
            const div = document.createElement('div');
            const myTagihan = state.tagihan.filter(t => t.id_penghuni === state.loggedInUser.id);
            // Sort
            myTagihan.sort((a,b) => b.id - a.id);
            
            let html = '<div class="space-y-4 fade-in delay-100">';
            myTagihan.forEach(t => {
                const isLunas = t.status_bayar === 'Lunas';
                const isNunggu = t.status_bayar === 'Menunggu Konfirmasi';
                let bgBorder = isLunas ? 'border-green-200 dark:border-green-500/30 bg-white dark:bg-surface' : (isNunggu ? 'border-yellow-200 dark:border-yellow-500/30 bg-yellow-50/30 dark:bg-yellow-900/10' : 'border-red-200 dark:border-red-500/30 bg-red-50/30 dark:bg-red-900/10 shadow-md');
                let badge = isLunas ? 'bg-green-100 text-green-600 dark:bg-green-500/20 dark:text-green-400' : (isNunggu ? 'bg-yellow-100 text-yellow-600 dark:bg-yellow-500/20 dark:text-yellow-400' : 'bg-red-100 text-red-600 dark:bg-red-500/20 dark:text-red-400');
                
                let btn = '';
                if(!isLunas && !isNunggu) btn = `<button onclick="bayarTagihan(${t.id})" class="btn-animate w-full md:w-auto px-6 py-3 bg-primary text-white font-bold rounded-xl shadow-lg flex justify-center items-center gap-2"><i class="ph-bold ph-wallet"></i> Bayar</button>`;
                else if(isNunggu) btn = `<span class="px-4 py-3 bg-slate-100 dark:bg-slate-800 rounded-xl text-sm font-medium text-slate-500 flex items-center gap-2 w-full md:w-auto justify-center"><i class="ph-fill ph-hourglass-high"></i> Menunggu Verifikasi</span>`;

                html += `
                    <div class="p-6 rounded-2xl border ${bgBorder} flex flex-col md:flex-row justify-between md:items-center gap-6 transition-all hover:shadow-lg">
                        <div class="flex gap-5 items-center">
                            <div class="w-16 h-16 rounded-2xl bg-slate-100 dark:bg-slate-800 flex items-center justify-center shadow-inner shrink-0">
                                <i class="ph-fill ph-receipt text-3xl text-slate-400"></i>
                            </div>
                            <div>
                                <p class="text-xs font-mono text-slate-400 mb-1">#INV-${String(t.id).substring(0,4)} &bull; ${t.tanggal}</p>
                                <h4 class="text-2xl font-extrabold dark:text-white mb-2">${formatRupiah(t.nominal)}</h4>
                                <span class="px-3 py-1 rounded-lg text-xs font-bold ${badge}">${t.status_bayar}</span>
                            </div>
                        </div>
                        <div class="w-full md:w-auto border-t border-slate-100 dark:border-slate-700/50 md:border-none pt-4 md:pt-0">
                            ${btn}
                        </div>
                    </div>
                `;
            });
            html += '</div>';
            if(myTagihan.length === 0) html = '<div class="text-center py-20 text-slate-400"><i class="ph-fill ph-check-circle text-6xl mb-4 text-slate-200 dark:text-slate-700"></i><p>Belum ada tagihan masuk.</p></div>';

            div.innerHTML = `
                <div class="mb-6 fade-in">
                    <h3 class="text-2xl font-bold dark:text-white">Tagihan Kost</h3>
                    <p class="text-slate-500">Bayar tepat waktu untuk menghindari teguran ya.</p>
                </div>
                ${html}
            `;
            return div;
        }

        window.bayarTagihan = async (id) => {
            const htmlModal = `
            Pilih metode pembayaran (Ketik Angka):
            1 - 🏦 Transfer BCA
            2 - 💵 Uang Tunai (Berikan ke Admin)
            `;
            const m = prompt(htmlModal);
            if(m === '1' || m === '2') {
                try {
                    const metodeStr = m === '1' ? 'Transfer BCA' : 'Cash';
                    await updateDoc(getDocRef('tagihan', id), { 
                        status_bayar: 'Menunggu Konfirmasi',
                        metode: metodeStr
                    });
                    
                    if(m==='1') alert('💳 INFO TRANSFER:\n\nBCA: 988657896\nA.N Kost Rama\n\nSimpan bukti transfer. Admin akan cek mutasi 1x24 jam.');
                    else alert('🤝 INFO CASH:\n\nNotifikasi dikirim! Admin akan mendatangimu atau temui di pos jaga.');
                    showToast('Permintaan pembayaran tersimpan di database!', 'success');
                } catch (error) {
                    console.error(error);
                    showToast('Gagal memproses pembayaran', 'error');
                }
            }
        };

        function renderPenghuniKomplain() {
            const div = document.createElement('div');
            
            const myKomplain = state.komplain.filter(k => k.id_penghuni === state.loggedInUser.id);
            let kompHtml = '';
            [...myKomplain].sort((a,b) => b.id - a.id).forEach(k => {
                const isP = k.status === 'Pending';
                kompHtml += `
                    <div class="p-4 rounded-xl border border-slate-100 dark:border-slate-800 bg-white dark:bg-surface mb-3 flex gap-4 items-start shadow-sm">
                        <div class="mt-1"><i class="ph-fill ${isP ? 'ph-clock text-yellow-500' : 'ph-check-circle text-green-500'} text-xl"></i></div>
                        <div class="flex-1">
                            <p class="text-sm dark:text-slate-200 leading-relaxed mb-2">"${k.isi}"</p>
                            <p class="text-xs font-medium text-slate-400">Status: <span class="${isP?'text-yellow-600 dark:text-yellow-400':'text-green-600 dark:text-green-400'}">${k.status}</span></p>
                        </div>
                        ${isP ? `<button onclick="batalKomplain(${k.id})" class="text-xs text-red-500 hover:underline px-2 py-1 bg-red-50 dark:bg-red-500/10 rounded">Batal</button>` : ''}
                    </div>
                `;
            });

            div.innerHTML = `
                <div class="grid grid-cols-1 lg:grid-cols-2 gap-8 fade-in">
                    <div>
                        <div class="mb-6">
                            <h3 class="text-2xl font-bold dark:text-white">Lapor Masalah</h3>
                            <p class="text-slate-500 text-sm">Ada kerusakan di kamar? Beritahu admin di sini.</p>
                        </div>
                        <form id="formKirimKomplain" class="bg-white dark:bg-surface p-6 rounded-3xl shadow-sm border border-slate-200 dark:border-slate-700">
                            <textarea id="isiKomplain" required placeholder="Ceritakan detail masalahnya..." class="w-full p-4 rounded-xl border border-slate-200 dark:border-slate-600 bg-slate-50 dark:bg-slate-900 focus:ring-2 focus:ring-primary outline-none dark:text-white resize-none h-40 transition mb-4"></textarea>
                            <button type="submit" class="btn-animate w-full bg-primary text-white py-3.5 rounded-xl font-bold shadow-lg shadow-primary/30 flex justify-center items-center gap-2"><i class="ph-bold ph-paper-plane-right"></i> Kirim Laporan</button>
                        </form>
                    </div>
                    <div>
                        <h4 class="font-bold text-lg mb-4 dark:text-white mt-2">Riwayat Laporan Kamu</h4>
                        <div class="max-h-[500px] overflow-y-auto custom-scrollbar pr-2">
                            ${kompHtml || '<div class="text-center py-10 border border-dashed border-slate-200 dark:border-slate-800 rounded-2xl"><p class="text-slate-400 text-sm">Belum ada riwayat komplain.</p></div>'}
                        </div>
                    </div>
                </div>
            `;

            setTimeout(() => {
                div.querySelector('#formKirimKomplain').addEventListener('submit', async (e) => {
                    e.preventDefault();
                    const isi = document.getElementById('isiKomplain').value;
                    const newId = Date.now();
                    
                    try {
                        await setDoc(getDocRef('komplain', newId), { 
                            id: newId, 
                            id_penghuni: state.loggedInUser.id, 
                            isi, 
                            status: 'Pending', 
                            tanggal: new Date().toLocaleDateString('id-ID', {day:'numeric', month:'short'}) 
                        });
                        showToast('Laporan sukses dikirim dan tersimpan di database!', 'success');
                        document.getElementById('formKirimKomplain').reset();
                    } catch (error) {
                        console.error(error);
                        showToast('Gagal mengirim laporan', 'error');
                    }
                });
            }, 0);

            return div;
        }

        window.batalKomplain = async (id) => {
            if(confirm('Batalkan laporan komplain ini?')) {
                try {
                    await deleteDoc(getDocRef('komplain', id));
                    showToast('Komplain dibatalkan dan dihapus dari database.');
                } catch (error) {
                    console.error(error);
                    showToast('Gagal membatalkan komplain', 'error');
                }
            }
        };

        // Initialize Base Theme
        initTheme(); 

        // Start Firebase Auth Flow which will trigger data loading
        initAuth();

    </script>
</body>
</html>
